<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OsloMeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:   #a3283a;   /* 7:1 on cream, white text on it passes AA */
    --rose-d: #741a28;
    --cream:  #fdf6ee;
    --ink:    #1a1514;
    --muted:  #2b2625;
    --gold:   #ecd29a;   /* label colour on the dark band */
    --border: #6e5f57;   /* visible form borders */
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--ink); overflow-x: hidden; line-height: 1.7; }

  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 3rem;
    background: rgba(253,246,238,.96);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--ink);
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--rose); letter-spacing: .04em; font-weight: 700; }
  .logo span { font-style: italic; font-weight: 400; }
  .lang { display: flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .lang button { font-family: 'Lato', sans-serif; font-size: .8rem; font-weight: 700; letter-spacing: .08em; padding: .4rem 1rem; background: transparent; color: var(--ink); border: none; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .hero {
    min-height: 78vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 7rem 2rem 4rem;
    color: #fff;
    position: relative; isolation: isolate; overflow: hidden;
    background: #3a3330;
  }
  /* picture layer: raise --img-brightness to lighten it further (1 = original) */
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background: url("image.jpg") center / cover no-repeat;
    filter: brightness(var(--img-brightness, 1.45)) saturate(1.1);
  }
  /* readability overlay on top of the picture */
  .hero::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(rgba(20,14,14,.3), rgba(20,14,14,.45));
  }
  .hero-tag { font-size: .78rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #fff; background: var(--rose); padding: .4rem 1.3rem; border-radius: 999px; margin-bottom: 1.8rem; display: inline-block; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.6rem, 7vw, 5.4rem); line-height: 1.08; max-width: 820px; }
  .hero h1 { text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .hero h1 em { font-style: italic; color: #f7b4bc; }
  .hero p { margin-top: 1.5rem; font-size: 1.15rem; color: #fff; max-width: 520px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .hero-cta { margin-top: 2.2rem; }
  .btn-primary { background: var(--rose); color: #fff; border: 2px solid var(--rose); border-radius: 999px; padding: .9rem 2.4rem; font-family: 'Lato', sans-serif; font-weight: 700; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; transition: background .2s, transform .15s; }
  .btn-primary:hover { background: var(--rose-d); border-color: var(--rose-d); transform: translateY(-2px); }
  .btn-primary:disabled { opacity: .7; cursor: wait; transform: none; }

  section { padding: 4.5rem 2rem; }
  .section-inner { max-width: 1000px; margin: 0 auto; }
  .section-label { font-size: .75rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--rose); margin-bottom: .8rem; }
  .section-title { font-family: 'Playfair Display', serif; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.2; }
  .section-title em { font-style: italic; color: var(--rose); }
  .section-body { font-size: 1.05rem; color: var(--muted); max-width: 640px; margin-top: 1.1rem; }

  #about { background: var(--ink); color: #fff; }
  #about .section-label { color: var(--gold); }
  #about .section-title em { color: #f4a7b0; }
  #about .section-body { color: #fff; max-width: 680px; }
  .pillars { display: grid; grid-template-columns: repeat(3,1fr); gap: 2rem; margin-top: 2.6rem; }
  .pillar { border-top: 3px solid #f4a7b0; padding-top: 1.2rem; }
  .pillar h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: .5rem; color: #fff; }
  .pillar p { font-size: .98rem; color: #f1e8e0; }

  #join { background: linear-gradient(155deg, #fdf6ee 0%, #f5dfe0 100%); }
  #join .section-inner { max-width: 680px; }
  .form-card { background: #fff; border: 2px solid var(--ink); border-radius: 20px; padding: 2.6rem; box-shadow: 0 20px 60px rgba(163,40,58,.12); margin-top: 2rem; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.1rem; }
  .field { display: flex; flex-direction: column; gap: .45rem; margin-bottom: 1.3rem; border: none; }
  label, legend { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); padding: 0; }
  input[type=text], input[type=number], input[type=email], select, textarea {
    font-family: 'Lato', sans-serif; font-size: 1rem; color: var(--ink); background: #fff;
    border: 2px solid var(--border); border-radius: 8px; padding: .7rem .95rem; width: 100%; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  select { appearance: auto; }
  input:focus, select:focus, textarea:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(163,40,58,.25); }
  .lang button:focus-visible, .btn-primary:focus-visible, .gender-btn input:focus-visible + span { outline: 3px solid var(--rose); outline-offset: 2px; }
  textarea { resize: vertical; min-height: 84px; }
  ::placeholder { color: #5a504b; opacity: 1; }
  .gender-group { display: flex; gap: .7rem; }
  .gender-btn { flex: 1; position: relative; }
  .gender-btn input { position: absolute; opacity: 0; }
  .gender-btn span { display: block; text-align: center; border: 2px solid var(--border); border-radius: 8px; padding: .65rem; font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; color: var(--ink); background: #fff; }
  .gender-btn span:hover { border-color: var(--rose); color: var(--rose); }
  .gender-btn input:checked + span { background: var(--rose); border-color: var(--rose); color: #fff; }
  .note { font-size: .9rem; color: var(--muted); }
  .form-submit { width: 100%; font-size: .95rem; padding: 1rem; }
  #formStatus { display: none; padding: .85rem 1rem; border-radius: 8px; font-size: .95rem; font-weight: 700; margin-bottom: 1.3rem; border: 2px solid; }
  #formStatus.ok  { display: block; background: #e6f4ea; border-color: #0b5d1e; color: #0b4a18; }
  #formStatus.err { display: block; background: #fdeaea; border-color: #9b1111; color: #7a0c0c; }

  footer { text-align: center; padding: 1.8rem 2rem; border-top: 2px solid var(--ink); font-size: .9rem; color: var(--muted); }
  .contact { font-size: 1rem; color: var(--ink); margin-bottom: .5rem; }
  .contact a { color: var(--rose); font-weight: 700; }
  footer strong { color: var(--rose); font-family: 'Playfair Display', serif; }

  @media (max-width: 768px) {
    nav { padding: .9rem 1.2rem; }
    section { padding: 3.5rem 1.4rem; }
    .pillars { grid-template-columns: 1fr; gap: 1.6rem; }
    .row3 { grid-template-columns: 1fr; gap: 0; }
    .form-card { padding: 1.5rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Oslo<span>Meet</span></div>
  <div class="lang" role="group" aria-label="Språk / Language">
    <button type="button" data-lang="no" aria-pressed="true">NO</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</nav>

<header class="hero">
  <span class="hero-tag" data-i18n="tag"></span>
  <h1><span data-i18n="h1a"></span><br><em data-i18n="h1b"></em></h1>
  <p data-i18n="heroP"></p>
  <div class="hero-cta"><a href="#join" class="btn-primary" data-i18n="cta"></a></div>
</header>

<section id="about">
  <div class="section-inner">
    <p class="section-label" data-i18n="aboutLabel"></p>
    <h2 class="section-title"><span data-i18n="aboutT1"></span> <em data-i18n="aboutT2"></em></h2>
    <p class="section-body" data-i18n="about1"></p>
    <p class="section-body" data-i18n="about2"></p>
    <div class="pillars">
      <div class="pillar"><h3 data-i18n="p1h"></h3><p data-i18n="p1"></p></div>
      <div class="pillar"><h3 data-i18n="p2h"></h3><p data-i18n="p2"></p></div>
      <div class="pillar"><h3 data-i18n="p3h"></h3><p data-i18n="p3"></p></div>
    </div>
  </div>
</section>

<section id="join">
  <div class="section-inner">
    <p class="section-label" data-i18n="joinLabel"></p>
    <h2 class="section-title"><span data-i18n="joinT1"></span> <em data-i18n="joinT2"></em></h2>
    <p class="section-body" data-i18n="joinP"></p>

    <form class="form-card" id="profileForm" novalidate onsubmit="submitForm(); return false;">
      <div id="formStatus" role="status"></div>

      <fieldset class="field">
        <legend data-i18n="sex"></legend>
        <div class="gender-group">
          <label class="gender-btn"><input type="radio" name="sex" value="female"/><span data-i18n="female"></span></label>
          <label class="gender-btn"><input type="radio" name="sex" value="male"/><span data-i18n="male"></span></label>
        </div>
      </fieldset>

      <div class="field">
        <label for="seeking" data-i18n="seeking"></label>
        <select id="seeking" name="seeking">
          <option value="" data-i18n="select"></option>
          <option value="Women" data-i18n="women"></option>
          <option value="Men" data-i18n="men"></option>
          <option value="Both" data-i18n="both"></option>
        </select>
      </div>

      <div class="row3">
        <div class="field">
          <label for="age" data-i18n="age"></label>
          <input type="number" id="age" name="age" min="18" max="99" data-i18n-ph="agePh"/>
        </div>
        <div class="field">
          <label for="height" data-i18n="height"></label>
          <input type="number" id="height" name="height" min="100" max="250" data-i18n-ph="heightPh"/>
        </div>
        <div class="field">
          <label for="weight" data-i18n="weight"></label>
          <input type="number" id="weight" name="weight" min="30" max="300" data-i18n-ph="weightPh"/>
        </div>
      </div>

      <div class="field"><label for="q1" data-i18n="q1"></label><textarea id="q1" name="q1" data-i18n-ph="q1Ph"></textarea></div>
      <div class="field"><label for="q2" data-i18n="q2"></label><textarea id="q2" name="q2" data-i18n-ph="q2Ph"></textarea></div>
      <div class="field"><label for="q3" data-i18n="q3"></label><textarea id="q3" name="q3" data-i18n-ph="q3Ph"></textarea></div>
      <div class="field"><label for="q4" data-i18n="q4"></label><textarea id="q4" name="q4" data-i18n-ph="q4Ph"></textarea></div>
      <div class="field"><label for="q5" data-i18n="q5"></label><textarea id="q5" name="q5" data-i18n-ph="q5Ph"></textarea></div>
      <div class="field"><label for="q6" data-i18n="q6"></label><input type="text" id="q6" name="q6" data-i18n-ph="q6Ph"/></div>
      <div class="field"><label for="q7" data-i18n="q7"></label><textarea id="q7" name="q7" data-i18n-ph="honestPh"></textarea></div>
      <div class="field"><label for="q8" data-i18n="q8"></label><textarea id="q8" name="q8" data-i18n-ph="honestPh"></textarea></div>

      <div class="field">
        <label for="email" data-i18n="email"></label>
        <input type="email" id="email" name="email" autocomplete="email" data-i18n-ph="emailPh"/>
        <p class="note" data-i18n="emailNote"></p>
      </div>

      <button type="submit" class="btn-primary form-submit" id="submitBtn"></button>
    </form>
  </div>
</section>

<footer>
  <p class="contact"><span data-i18n="contact"></span> <a href="mailto:meet.oslo.folk@gmail.com">meet.oslo.folk@gmail.com</a></p>
  <p><strong>OsloMeet</strong> &middot; <span data-i18n="footer"></span></p>
</footer>

      about2: "Du fyller ut skjemaet, vi leser alt selv, matcher deltakerne manuelt og kontakter dere igjen. Første møte avtales på et offentlig sted.",
      p1h: "Ord før bilder", p1: "Ingen bilder, ingen sosiale lenker. Du blir kjent gjennom svarene dine.",
      p2h: "Ekte matching", p2: "Vi matcher på verdier, nysgjerrighet og humor, og gjør det for hånd.",
      p3h: "Trygt og gratis", p3: "Et menneske følger opp hver match. Det koster ingenting å delta. Dersom det skulle gjelde: Vi skal gi guttene ideer til dater og råd om hvordan de bør behandle jentene på date :).",
      joinLabel: "Finn din match",
      joinT1: "Ta", joinT2: "steget",
      joinP: "Svar så åpent og konkret du kan, på norsk eller engelsk. Vi tar kontakt når vi har funnet noen som er verdt å møte.",
      sex: "Kjønn", female: "Kvinne", male: "Mann",
      seeking: "Jeg er åpen for å møte", select: "Velg …", women: "Kvinner", men: "Menn", both: "Begge",
      age: "Alder", agePh: "f.eks. 24",
      height: "Høyde (cm)", heightPh: "f.eks. 175",
      weight: "Vekt (kg)", weightPh: "f.eks. 70",
      q1: "Hvorfor ønsker du et romantisk forhold?",
      q1Ph: "Jeg trenger å bli minnet på hvor godt romantisk selskap kan være …",
      q2: "Hvordan fikk din siste romantiske interesse deg til å føle deg, og hvorfor likte(/ikke) du vedkommende?",
      q2Ph: "Han fikk meg til å føle meg ung …",
      q3: "Hvilken innsats la du ned i å bli kjent med din siste date?",
      q3Ph: "«Så hva studerer du?» «…» «Kult»",
      q4: "Hvilken positiv side ved deg kan du ikke vise frem på en datingprofil?",
      q4Ph: "Min udødelige kjærlighet til mat og bøker",
      q5: "Hvorfor er favorittboken, -filmen eller -mediet ditt favoritten din?",
      q5Ph: "…",
      q6: "Hva er en aboslutt dealbreaker for deg?",
      q6Ph: "Jeg dater ikke folk uten jobb as",

      honestPh: "Vær så nøyaktig og ærlig som du kan",
      email: "E-postadresse", emailPh: "navn@eksempel.no",
      emailNote: "Vi bruker e-posten kun til å kontakte deg om en match.",
      submit: "Send inn profilen", sending: "Sender …",
      contact: "Har du spørsmål? Send en e-post til",
      footer: "© 2026 · Gratis og drevet av frivillige · Vis tålmodighet med andre.",
      errPrefix: "Vennligst fyll inn: ",
      errs: { sex: "kjønn", seeking: "hvem du er åpen for å møte", age: "en gyldig alder (18+)", height: "høyde", weight: "vekt",
              q1: "hvorfor du ønsker et forhold", q2: "forrige romantiske interesse", q3: "innsats på forrige date",
              q4: "din positive side", q5: "favorittmedie", q6: "et brudd på avtalen", q7: "hva du leter etter", q8: "hva du kan tilby",
              email: "en gyldig e-postadresse" },
      ok: "Profilen er mottatt! Vi tar kontakt så snart vi har funnet en match.",
      fail: "Noe gikk galt: {m}. Prøv igjen."
    },
    en: {
      tag: "Completely free",
      h1a: "Meet someone", h1b: "before you know who they are.",
      heroP: "You write about yourself and what you're looking for. We match by hand and get in touch. No photos, no algorithms, no payment.",

      aboutLabel: "About the initiative and our mission",
      aboutT1: "A matchmaker", aboutT2: "with no eyes.",
      about1: "We're a small group of friends with plenty of dating-app experience in Oslo, and we believe the deepest connections are built through your own effort. Dating has become faster and more competitive than the stock market. It doesn't have to be.",
      about2: "You fill in the form, we read everything ourselves, match participants manually and contact you again. The first meeting is arranged in a public place.",

      p2h: "Real matching", p2: "We match on values, curiosity and sense of humour, and we do it by hand.",
      p3h: "Safe and free", p3: "A real person follows up every match. It costs nothing to take part. We'll give the guys date ideas and advice on how to treat the girls on dates :)",

      joinT1: "Take the", joinT2: "leap",
      joinP: "Answer as openly and specifically as you can, in Norwegian or English. We'll get in touch when we find someone worth meeting.",
      sex: "Sex", female: "Female", male: "Male",
      seeking: "I'm open to meeting", select: "Select …", women: "Women", men: "Men", both: "Both",
      age: "Age", agePh: "e.g. 24",
      height: "Height (cm)", heightPh: "e.g. 175",
      weight: "Weight (kg)", weightPh: "e.g. 70",
      q1: "Why do you seek a romantic relationship?",
      q1Ph: "I need to be reminded how good romantic company can be …",
      q2: "How did your last romantic interest make you feel, and why did you like (/didn't like) them?",
      q2Ph: "He made me feel young …",
      q3: "What effort did you put into getting to know your last date?",
      q3Ph: "\"So what do you study?\" \"…\" \"Cool\"",
      q4: "What positive side of you couldn't you show on a dating profile?",
      q4Ph: "My immortal spirit and love of food and books",
      q5: "Why is your favourite book, movie or media your favourite?",
      q5Ph: "…",
      q6: "What's a dealbreaker you won't compromise on?",
      q6Ph: "I don't date people without a job",
      q7: "What qualities do you look for in a partner?",
      q8: "What qualities can you offer as a partner?",
      honestPh: "Be as precise and honest as you can",
      email: "Email address", emailPh: "name@example.com",
      emailNote: "We only use your email to contact you about a match.",
      submit: "Send my profile", sending: "Sending …",
      contact: "For any questions, send an email to",
      footer: "© 2026 · Free and run by volunteers · Be patient with others.",
      errPrefix: "Please fill in: ",
      errs: { sex: "your sex", seeking: "who you're open to meeting", age: "a valid age (18+)", height: "your height", weight: "your weight",
              q1: "why you seek a relationship", q2: "your last romantic interest", q3: "effort on your last date",
              q4: "your positive side", q5: "your favourite media", q6: "a dealbreaker", q7: "what you look for", q8: "what you offer",
              email: "a valid email address" },
      ok: "Profile received! We'll be in touch as soon as we find your match.",
      fail: "Something went wrong: {m}. Please try again."
    }
  };

  var lang = "no";

  function t(key) { return I18N[lang][key]; }

  function applyLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function(el) { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el) { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll(".lang button").forEach(function(b) { b.setAttribute("aria-pressed", b.dataset.lang === l); });
    document.getElementById("submitBtn").textContent = t("submit");
    var s = document.getElementById("formStatus");
    s.className = ""; s.textContent = "";
    try { localStorage.setItem("lang", l); } catch (e) {}
  }

  document.querySelectorAll(".lang button").forEach(function(b) {
    b.addEventListener("click", function() { applyLang(b.dataset.lang); });
  });

  (function init() {
    var saved = null;
    try { saved = localStorage.getItem("lang"); } catch (e) {}
    var guess = /^(nb|nn|no)\b/i.test(navigator.language || "") ? "no" : "en";
    applyLang(saved === "no" || saved === "en" ? saved : guess);
  })();

  //GOOGLE APPS SCRIPT DEPLOYMENT:
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm5pFu2DYbt1BhA13MVUmMmDJQF1nihbDtU3eiK2i5YfpiFT1tz5w34xbRfQNj5jk/exec";

  function val(id) { return document.getElementById(id).value.trim(); }

  async function submitForm() {
    var btn = document.getElementById("submitBtn");
    var sexEl = document.querySelector('input[name="sex"]:checked');

    var data = {
      sex:     sexEl ? sexEl.value : "",
      seeking: val("seeking"),
      age:     val("age"),
      height:  val("height"),
      weight:  val("weight"),
      q1: val("q1"), q2: val("q2"), q3: val("q3"), q4: val("q4"),
      q5: val("q5"), q6: val("q6"), q7: val("q7"), q8: val("q8"),
      email:   val("email"),
      lang:    lang
    };

    var missing = [];
    if (!data.sex)     missing.push("sex");
    if (!data.seeking) missing.push("seeking");
    if (!data.age || parseInt(data.age, 10) < 18) missing.push("age");
    if (!data.height)  missing.push("height");
    if (!data.weight)  missing.push("weight");
    ["q1","q2","q3","q4","q5","q6","q7","q8"].forEach(function(k) { if (!data[k]) missing.push(k); });
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) missing.push("email");

    if (missing.length) {
      showStatus("err", t("errPrefix") + missing.map(function(k) { return t("errs")[k]; }).join(", ") + ".");
      return;
    }

    btn.disabled = true;
    btn.textContent = t("sending");
    document.getElementById("formStatus").className = "";

    try {
      var res  = await fetch(SCRIPT_URL, {
        method: "POST",
        body:   JSON.stringify(data),
        headers: { "Content-Type": "text/plain" }
      });
      var json = await res.json().catch(function() { return { success: true }; });

      if (json.success !== false) {
        showStatus("ok", t("ok"));
        document.getElementById("profileForm").reset();
      } else {
        throw new Error(json.message || "Unknown error");
      }
    } catch (err) {
      showStatus("err", t("fail").replace("{m}", err.message));
    } finally {
      btn.disabled = false;
      btn.textContent = t("submit");
    }
  }

  function showStatus(type, msg) {
    var el = document.getElementById("formStatus");
    el.textContent = msg;
    el.className = type;
    el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
</script>
</body>
</html>
